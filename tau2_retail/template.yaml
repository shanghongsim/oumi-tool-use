AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Shared, stateful tau2 retail endpoint tools for Oumi evaluations.

Parameters:
  EndpointToken:
    Type: String
    NoEcho: true
    Description: Bearer token Oumi sends to the public Function URL.
  EnvironmentName:
    Type: String
    Default: development
    AllowedPattern: '[A-Za-z0-9-]+'

Resources:
  Sessions:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${EnvironmentName}-tau2-retail-sessions'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  ToolFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerTag: tau2-retail-tools
      DockerContext: ..
      Dockerfile: tau2_retail/lambda.Dockerfile
    Properties:
      PackageType: Image
      Architectures:
        - arm64
      Timeout: 60
      MemorySize: 1024
      Environment:
        Variables:
          SESSIONS_TABLE: !Ref Sessions
          TOOL_ENDPOINT_TOKEN: !Ref EndpointToken
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Sessions
      FunctionUrlConfig:
        AuthType: NONE

Outputs:
  ToolFunctionUrl:
    Description: Base URL; configure endpoints as /runs/<run-id>/tools/<tool-name>.
    Value: !GetAtt ToolFunctionUrl.FunctionUrl
  SessionsTableName:
    Value: !Ref Sessions
